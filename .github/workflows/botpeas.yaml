name: botpeas_action

on:
  schedule:
    # Esegue il bot ogni 8 ore (00:00, 08:00, 16:00 UTC) # aggiornamento cron
    - cron: '0 */8 * * *'
  workflow_dispatch:
  pull_request:
    branches: [ "main" ]
  
jobs:
  build:
    runs-on: ubuntu-latest
    # Permessi necessari per scrivere nella repository
    permissions:
      contents: write
      
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4 # Aggiornato alla v4

      - name: Setup Python
        uses: actions/setup-python@v5 # Aggiornato alla v5
        with: 
          python-version: '3.10'

      - name: Setup Dependencies
        run: python3 -m pip install -r requirements.txt

      - name: Run CVEs Monitor
        run: python3 botpeas.py
        shell: bash
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          VULNERS_API_KEY: ${{ secrets.VULNERS_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          NTFY_URL: ${{ secrets.NTFY_URL }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_AUTH: ${{ secrets.NTFY_AUTH }}

      - name: Commit and Push changes
        run: |
            git config --local user.email "action@github.com"
            git config --local user.name "github-actions[bot]"
            git add output/botpeas.json
            # Esegue il commit solo se ci sono cambiamenti, evitando errori
            git diff --quiet && git diff --staged --quiet || (git commit -m "Bot auto update" && git push)
